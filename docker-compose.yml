services:
  db:
    image: postgres:16.4
    restart: always
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: admin
      POSTGRES_DB: smart-platform
    ports:
      - 5432:5432
  mocksaml:
    image: boxyhq/mock-saml:1.3.9
    container_name: saas-mocksaml
    ports:
      - 4000:4000
    environment:
      APP_URL: http://localhost:4000
      ENTITY_ID: https://saml.example.com/entityid
      # Freshly generated keypair (openssl req -x509 ...) — the keys that were
      # copied from the CI workflow are corrupted (control byte in the PEM) and
      # crash mock-saml 1.3.9's XML writer. The IdP must sign responses, so the
      # metadata needs a real certificate.
      PUBLIC_KEY: ''
      PRIVATE_KEY: ''