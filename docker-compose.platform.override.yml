# Image-only override for the INTEGRATED VPS stack (the existing docker-compose.yml
# under /var/www/multitenant-smart-and-pro, which owns backend/sqlserver/platform/front/
# postgres services, aliases, volumes and ports 5032/5433).
#
# Usage on the server (done automatically by the deploy pipeline):
#   docker compose -f docker-compose.yml -f docker-compose.platform.override.yml pull platform
#   docker compose -f docker-compose.yml -f docker-compose.platform.override.yml up -d --no-build platform
#
# It replaces the platform service's local `build:` with the GHCR image while
# preserving everything else (network, .env, volumes, port 5032:4002).
#
# NOTE: the service key here must match the one in the server compose file
# (`platform`). Verify with: docker compose config --services — the deploy
# pipeline fails closed if the key is absent.
services:
  platform:
    image: ghcr.io/smarterp-multitenant/smart-platform:${PLATFORM_IMAGE_TAG:-latest}
    pull_policy: always
    # Runtime secrets rendered by the deploy pipeline (P4.2 render-env writes
    # them into the server `.env`; compose interpolates from that file).
    #
    # They must be declared here because the server's base compose lists
    # `environment:` entries explicitly instead of using `env_file`, so a key
    # that is only present in `.env` never reaches the container. That gap
    # caused the 2026-09-12 incident: CRON_SECRET,
    # ERP_TOKEN_ENCRYPTION_KEY and the reCAPTCHA pair were rendered into
    # `.env` but were absent inside the running container — captcha silently
    # off, `/api/cron/*` answering 503 (no secret), and ERP token encryption
    # failing closed in production.
    #
    # RECAPTCHA_*: the pipeline enforces both-or-neither, real keys only
    # (`lib/recaptcha.ts` activates captcha as soon as both are non-empty).
    # When the pair is absent the pipeline renders explicit empty values and
    # captcha stays off (that is what `${VAR:-}` resolves to below).
    environment:
      - CRON_SECRET=${CRON_SECRET:-}
      - ERP_TOKEN_ENCRYPTION_KEY=${ERP_TOKEN_ENCRYPTION_KEY:-}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
