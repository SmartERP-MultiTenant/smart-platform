# CI/CD for smart-platform — architecture, secrets & runbooks live in docs/CI-CD.md.
# Jobs:
#   ci        — existing CI checks (lint/format/locale/jest/build-ci/types/prisma/playwright); runs on every event.
#   container — build the Docker image; push to GHCR only for main pushes (and manual deploys of the current commit).
#   deploy    — SSH deploy to the VPS (pull → prisma migrate deploy → swap container → health poll); main pushes and manual dispatch only.
#   notify    — run summary (+ optional Slack) after every run.

name: Build

on:
  push:
    branches:
      - main
      - release
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Deploy an existing GHCR image tag instead of building the current
          commit (e.g. sha-<40 hex> or latest). Leave empty to build and
          deploy the current commit. Only meaningful when dispatched from main.
        required: false
        default: ''
        type: string

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXTAUTH_URL: http://localhost:4002
      NEXTAUTH_SECRET: secret
      NEXTAUTH_SESSION_STRATEGY: database
      AUTH_PROVIDERS: github,credentials,saml,idp-initiated
      FEATURE_TEAM_SSO: true
      FEATURE_TEAM_DSYNC: true
      FEATURE_TEAM_AUDIT_LOG: true
      FEATURE_TEAM_WEBHOOK: false
      FEATURE_TEAM_API_KEY: true
      FEATURE_TEAM_DELETION: true
      FEATURE_TEAM_PAYMENTS: true
      CONFIRM_EMAIL: false
      EMAIL_ENABLED: false
      HIDE_LANDING_PAGE: false
      GROUP_PREFIX: smart-platform-
      DISABLE_NON_BUSINESS_EMAIL_SIGNUP: false
      APP_URL: http://localhost:4002
      JACKSON_PRODUCT_ID: smart-platform
      JACKSON_WEBHOOK_SECRET: your-webhook-secret
      JACKSON_API_KEY: secret
      MOCKSAML_ORIGIN: http://localhost:4000
      # P4.9: point ERP calls at the hermetic stub the e2e suite starts via
      # the second playwright.config.ts webServer entry (erp-stub.cjs).
      ERP_API_URL: http://127.0.0.1:4100/api
      # P4.14: ERP login handoff target composition (lib/erp/handoff.ts) — the
      # payment-success / register-funnel CTAs need an allowlisted client URL.
      ERP_CLIENT_URL: http://localhost:4200
      ERP_CLIENT_LOGIN_PATH: /auth/login
      ERP_BASE_DOMAIN: smartapro.com
      DEBUG: pw:webserver

    services:
      postgres:
        image: postgres:16.4
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: ''
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mocksaml:
        image: boxyhq/mock-saml:1.3.9
        ports:
          - 4000:4000
        env:
          APP_URL: http://localhost:4000
          ENTITY_ID: https://saml.example.com/entityid
          PUBLIC_KEY: ''
          PRIVATE_KEY: ''

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          check-latest: true
      # Deterministic install from the lockfile (matches the Dockerfile).
      - run: npm ci --legacy-peer-deps
      - run: npm run check-lint
      - run: npm run check-format
      - run: npm run check-locale
      - run: npm run test
      # Coverage gate for the enforced lib thresholds (jest.config.js)
      - run: npx jest --coverage
      - run: npm run build-ci
      - run: npm run check-types
      - run: npx prisma migrate deploy
      - name: Install playwright browser dependencies
        run: npx playwright install chromium
      - name: e2e tests
        run: npx playwright test -x
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 2

  container:
    needs: [ci]
    # Manual deploys of an existing image tag skip the build entirely.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        # Only needed when this build will push (main pushes, manual builds of the current commit).
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag == '')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # PRs and release-branch pushes build (Dockerfile validation) without publishing.
          push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag == '') }}
          tags: |
            ghcr.io/smarterp-multitenant/smart-platform:sha-${{ github.sha }}
            ghcr.io/smarterp-multitenant/smart-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [ci, container]
    # Deploy only from main: automatic on main pushes, manual when dispatched with an image_tag.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: smart-platform-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tag
        id: tag
        env:
          DISPATCH_TAG: ${{ github.event.inputs.image_tag }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            echo "tag=${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard — required secrets configured
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          for var in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!var}" ]; then
              echo "::error::Deploy secret '${var}' is not configured. Add it to the 'production' environment (Settings → Environments → production). See docs/CI-CD.md."
              exit 1
            fi
          done

      - name: Guard — ENV_* app secrets configured (P4.2 render-env)
        env:
          ENV_NEXTAUTH_SECRET: ${{ secrets.ENV_NEXTAUTH_SECRET }}
          ENV_DATABASE_URL: ${{ secrets.ENV_DATABASE_URL }}
          ENV_ERP_PLATFORM_API_KEY: ${{ secrets.ENV_ERP_PLATFORM_API_KEY }}
          ENV_ERP_ADMIN_USERNAME: ${{ secrets.ENV_ERP_ADMIN_USERNAME }}
          ENV_ERP_ADMIN_PASSWORD: ${{ secrets.ENV_ERP_ADMIN_PASSWORD }}
          ENV_SMTP_USER: ${{ secrets.ENV_SMTP_USER }}
          ENV_SMTP_PASSWORD: ${{ secrets.ENV_SMTP_PASSWORD }}
          ENV_RECAPTCHA_SITE_KEY: ${{ secrets.ENV_RECAPTCHA_SITE_KEY }}
          ENV_RECAPTCHA_SECRET_KEY: ${{ secrets.ENV_RECAPTCHA_SECRET_KEY }}
          ENV_CRON_SECRET: ${{ secrets.ENV_CRON_SECRET }}
          ENV_ERP_TOKEN_ENCRYPTION_KEY: ${{ secrets.ENV_ERP_TOKEN_ENCRYPTION_KEY }}
        run: |
          # P4.2 render-env guard (D1-A/D2-C): the required production runtime
          # secret set must exist as GitHub 'production' environment secrets.
          # Canonical list: docs/env-matrix.md rows with source [GHS:production]
          # (status real) + docs/CI-CD.md 'Secret provisioning' §2.
          # Also guarded: CRON_SECRET (scheduled-route guard — /api/cron/*
          # returns 503 when unset) and ERP_TOKEN_ENCRYPTION_KEY (required in
          # production by lib/crypto/erpToken.ts — encrypt/decrypt throw when
          # the key is missing, never a silent published fallback).
          # NOT guarded here: conditional vars (JACKSON_*, OAuth, SENTRY_AUTH_TOKEN)
          # and the RECAPTCHA pair — the latter is validated in the render step
          # (real keys both-or-neither; a placeholder would ENABLE captcha with
          # invalid keys and break credentials login — lib/recaptcha.ts:5).
          # Only NAMES are printed; values stay inside the secret context.
          set -euo pipefail
          required="ENV_NEXTAUTH_SECRET ENV_DATABASE_URL ENV_ERP_PLATFORM_API_KEY ENV_ERP_ADMIN_USERNAME ENV_ERP_ADMIN_PASSWORD ENV_SMTP_USER ENV_SMTP_PASSWORD ENV_CRON_SECRET ENV_ERP_TOKEN_ENCRYPTION_KEY"
          missing=""
          for var in $required; do
            if [ -z "${!var:-}" ]; then
              missing="${missing} ${var}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::ENV_* app secret(s) not configured in the 'production' environment (Settings → Environments → production → Environment secrets):${missing}"
            exit 1
          fi
          echo "ENV_* app secrets guard OK — all 9 required production secrets present (names only)."

      - name: Validate image tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^(latest|sha-[0-9a-f]{40})$'; then
            echo "::error::Invalid image tag '${TAG}' — expected 'latest' or 'sha-<40 hex>'."
            exit 1
          fi
          echo "Deploying image tag: $TAG"

      - name: Set up SSH agent (deploy key)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install server host key (strict verification)
        env:
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload Compose files to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "mkdir -p /var/www/multitenant-smart-and-pro"
          scp -P "$PORT" \
            docker-compose.platform.override.yml docker-compose.prod.yml \
            "$SSH_USER@$SSH_HOST:/var/www/multitenant-smart-and-pro/"

      - name: Render ENV_* secrets into server .env (CI-owned lines, P4.2)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          ENV_NEXTAUTH_SECRET: ${{ secrets.ENV_NEXTAUTH_SECRET }}
          ENV_DATABASE_URL: ${{ secrets.ENV_DATABASE_URL }}
          ENV_ERP_PLATFORM_API_KEY: ${{ secrets.ENV_ERP_PLATFORM_API_KEY }}
          ENV_ERP_ADMIN_USERNAME: ${{ secrets.ENV_ERP_ADMIN_USERNAME }}
          ENV_ERP_ADMIN_PASSWORD: ${{ secrets.ENV_ERP_ADMIN_PASSWORD }}
          ENV_SMTP_USER: ${{ secrets.ENV_SMTP_USER }}
          ENV_SMTP_PASSWORD: ${{ secrets.ENV_SMTP_PASSWORD }}
          ENV_RECAPTCHA_SITE_KEY: ${{ secrets.ENV_RECAPTCHA_SITE_KEY }}
          ENV_RECAPTCHA_SECRET_KEY: ${{ secrets.ENV_RECAPTCHA_SECRET_KEY }}
          ENV_CRON_SECRET: ${{ secrets.ENV_CRON_SECRET }}
          ENV_ERP_TOKEN_ENCRYPTION_KEY: ${{ secrets.ENV_ERP_TOKEN_ENCRYPTION_KEY }}
        run: |
          # P4.2 render-env (M3): assemble KEY='value' single-quoted literal
          # lines and deliver them to the server via SSH stdin ONLY — never
          # argv, never sed interpolation, never echoed. GitHub masks secret
          # values, and we never print them anyway (names only).
          # CRON_SECRET and ERP_TOKEN_ENCRYPTION_KEY travel the same path so
          # the scheduled-route guard and at-rest token encryption are active
          # in production (names:docs/env-matrix.md rows for both).
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          readonly DEPLOY_DIR=/var/www/multitenant-smart-and-pro
          required="ENV_NEXTAUTH_SECRET ENV_DATABASE_URL ENV_ERP_PLATFORM_API_KEY ENV_ERP_ADMIN_USERNAME ENV_ERP_ADMIN_PASSWORD ENV_SMTP_USER ENV_SMTP_PASSWORD ENV_CRON_SECRET ENV_ERP_TOKEN_ENCRYPTION_KEY"
          payload="$(mktemp)"
          trap 'rm -f "$payload"' EXIT
          chmod 600 "$payload"
          names=""
          count=0
          for var in $required; do
            value="${!var}"
            key="${var#ENV_}"
            # Fail closed on values containing a single quote: single-quoted
            # dotenv literals cannot represent one portably. Regenerate the
            # secret without single quotes (message names the secret only).
            if [[ "$value" == *"'"* ]]; then
              echo "::error::Secret '${var}' contains a single quote — not representable in a dotenv literal. Regenerate its value without single quotes."
              exit 1
            fi
            printf "%s='%s'\n" "$key" "$value" >> "$payload"
            names="${names} ${key}"
            count=$((count + 1))
          done
          # RECAPTCHA pair — both-or-neither, REAL keys only (lib/recaptcha.ts:5
          # activates captcha whenever both are non-empty; placeholder keys would
          # break credentials login). Absent pair is rendered as explicit empty
          # values so stale keys from an earlier deploy cannot linger server-side.
          rc_site="${ENV_RECAPTCHA_SITE_KEY:-}"
          rc_secret="${ENV_RECAPTCHA_SECRET_KEY:-}"
          if [ -n "$rc_site" ] || [ -n "$rc_secret" ]; then
            if [ -z "$rc_site" ] || [ -z "$rc_secret" ]; then
              echo "::error::RECAPTCHA secrets must be provisioned as a pair (both ENV_RECAPTCHA_SITE_KEY and ENV_RECAPTCHA_SECRET_KEY) with REAL keys, or neither. Half-provisioned captcha is not allowed."
              exit 1
            fi
            if [[ "$rc_site" == *"'"* ]] || [[ "$rc_secret" == *"'"* ]]; then
              echo "::error::A RECAPTCHA secret contains a single quote — not representable in a dotenv literal. Regenerate it without single quotes."
              exit 1
            fi
            printf "%s='%s'\n" "RECAPTCHA_SITE_KEY" "$rc_site" >> "$payload"
            printf "%s='%s'\n" "RECAPTCHA_SECRET_KEY" "$rc_secret" >> "$payload"
            names="${names} RECAPTCHA_SITE_KEY RECAPTCHA_SECRET_KEY"
            count=$((count + 2))
          else
            printf "%s='%s'\n" "RECAPTCHA_SITE_KEY" "" >> "$payload"
            printf "%s='%s'\n" "RECAPTCHA_SECRET_KEY" "" >> "$payload"
          fi
          # Transport: stdin only (ssh < payload). The remote command string
          # contains no values — it only redirects stdin into .env.render.
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" \
            "umask 077 && cat > '${DEPLOY_DIR}/.env.render' && chmod 600 '${DEPLOY_DIR}/.env.render'" \
            < "$payload"
          echo "Rendered ${count} CI-owned secret line(s) into .env.render for the deploy script to merge (names:${names} )."

      - name: Deploy — pull, migrate, swap, health
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" bash -s "$IMAGE_TAG" <<'REMOTE'
          set -euo pipefail

          readonly DEPLOY_DIR=/var/www/multitenant-smart-and-pro
          readonly BASE="$DEPLOY_DIR/docker-compose.yml"
          readonly OVERRIDE="$DEPLOY_DIR/docker-compose.platform.override.yml"
          readonly ENV_FILE="$DEPLOY_DIR/.env"
          readonly SERVICE_KEY=platform
          readonly TAG="$1"
          readonly HEALTH_URL=http://127.0.0.1:5032/api/health

          echo "[cd] deploy dir: $DEPLOY_DIR"
          [ -d "$DEPLOY_DIR" ] || { echo "::error::deploy dir missing: $DEPLOY_DIR"; exit 1; }
          cd "$DEPLOY_DIR"

          command -v docker >/dev/null 2>&1 || { echo "::error::docker is not installed on the server"; exit 1; }
          docker compose version >/dev/null 2>&1 || { echo "::error::docker compose v2 is not available on the server"; exit 1; }
          [ -f "$BASE" ]     || { echo "::error::base compose file not found: $BASE"; exit 1; }
          [ -f "$OVERRIDE" ] || { echo "::error::override compose file not found: $OVERRIDE"; exit 1; }
          [ -f "$ENV_FILE" ] || { echo "::error::$ENV_FILE is missing — run the one-time VPS bootstrap first (docs/CI-CD.md)"; exit 1; }
          [ "$(stat -c %a "$ENV_FILE")" = "600" ] || { echo "::error::.env must be mode 600 (found $(stat -c %a "$ENV_FILE"))"; exit 1; }

          # Disk guard: abort before pulling a ~2.7GB image onto a disk that is
          # nearly full (Postgres errors with "No space left on device" at 100%).
          readonly DISK_PCT="$(df --output=pcent / | tail -1 | tr -dc '0-9')"
          echo "[cd] root disk usage: ${DISK_PCT}%"
          [ "${DISK_PCT}" -lt 85 ] || { echo "::error::root disk ${DISK_PCT}% full (>=85%) — refusing to deploy. Free space first: docker image prune / builder prune (see docs/CI-CD.md)."; exit 1; }
          printf '%s' "$TAG" | grep -Eq '^(latest|sha-[0-9a-f]{40})$' || { echo "::error::invalid image tag: $TAG"; exit 1; }
          echo "[cd] image tag: $TAG"

          # Backup .env before any mutation — path is printed at the end for manual recovery.
          cp "$ENV_FILE" "$ENV_FILE.bak.$(date +%Y%m%d%H%M%S)"
          BACKUP="$(ls -1t "$ENV_FILE".bak.* | head -n 1)"

          # P4.2 render-env merge (D2-C/m8): apply the CI-delivered ENV_* secret
          # lines from .env.render. Ordering guarantee: this runs AFTER the .env
          # backup above and BEFORE every other mutation, so .env.bak.<ts> always
          # holds the PRE-RENDER state (rollback recipe: docs/CI-CD.md §5). Once
          # applied, these lines are CI-owned — hand edits get overwritten on the
          # next deploy (intended single-source behavior). Values are never echoed.
          RENDER_FILE="$DEPLOY_DIR/.env.render"
          if [ -f "$RENDER_FILE" ]; then
            [ -r "$RENDER_FILE" ] || { echo "::error::.env.render exists but is not readable"; rm -f "$RENDER_FILE"; exit 1; }
            # Collect rendered key names only — never values.
            RENDERED_KEYS=()
            while IFS= read -r rline || [ -n "$rline" ]; do
              case "$rline" in ''|'#'*) continue ;; esac
              RENDERED_KEYS+=("${rline%%=*}")
            done < "$RENDER_FILE"
            if [ "${#RENDERED_KEYS[@]}" -eq 0 ]; then
              echo "::error::.env.render contains no key=value lines"
              rm -f "$RENDER_FILE"
              exit 1
            fi
            # Drop pre-existing lines owned by a rendered key (any dotenv form:
            # leading whitespace, `export ` prefix, `=` or `:` separator — same
            # detection shape as the EMAIL_ENABLED block below). Keys are
            # [A-Z0-9_]+ (safe in the extended regex).
            PATTERN=""
            for rkey in "${RENDERED_KEYS[@]}"; do
              [ -n "$PATTERN" ] && PATTERN="${PATTERN}|"
              PATTERN="${PATTERN}^[[:space:]]*(export[[:space:]]+)?${rkey}([[:space:]]*[:=])"
            done
            # Create the merged temp under 077 so secret-bearing content is
            # never group/world-readable before the chmod 600 below.
            umask 077
            grep -vE "$PATTERN" "$ENV_FILE" > "$ENV_FILE.p42.$$" || true
            cat "$RENDER_FILE" >> "$ENV_FILE.p42.$$";
            mv "$ENV_FILE.p42.$$" "$ENV_FILE"
            chmod 600 "$ENV_FILE"
            rm -f "$RENDER_FILE"
            RENDERED_LIST="$(IFS=,; echo "${RENDERED_KEYS[*]}")"
            echo "[cd] applied ${#RENDERED_KEYS[@]} CI-owned secret line(s): ${RENDERED_LIST}"
          else
            echo "::error::.env.render missing — the render step must deliver ENV_* secret lines before the deploy script runs"
            exit 1
          fi

          # Idempotent PLATFORM_IMAGE_TAG update.
          if grep -q '^PLATFORM_IMAGE_TAG=' "$ENV_FILE"; then
            sed -i "s|^PLATFORM_IMAGE_TAG=.*|PLATFORM_IMAGE_TAG=${TAG}|" "$ENV_FILE"
          else
            printf 'PLATFORM_IMAGE_TAG=%s\n' "$TAG" >> "$ENV_FILE"
          fi

          # Idempotent EMAIL_ENABLED default: the explicit email gate
          # (lib/email/sendEmail.ts) defaults to disabled, and existing server
          # .env files predate the flag — default it on so SMTP delivery keeps
          # working. Opt out by adding EMAIL_ENABLED=false to the server .env.
          # Detection accepts any valid dotenv form (leading whitespace,
          # `export ` prefix, `=` or `:` separator) so an opt-out written as
          # `EMAIL_ENABLED: false` or `export EMAIL_ENABLED=false` is still
          # recognized as present and never overridden by the appended line —
          # a later duplicate assignment would win in dotenv parsing.
          if ! grep -qE '^[[:space:]]*(export[[:space:]]+)?EMAIL_ENABLED([[:space:]]*[:=])' "$ENV_FILE"; then
            printf 'EMAIL_ENABLED=true\n' >> "$ENV_FILE"
          fi

          COMPOSE=(docker compose --project-directory "$DEPLOY_DIR" -f "$BASE" -f "$OVERRIDE")

          "${COMPOSE[@]}" config --quiet || { echo "::error::docker compose config failed"; exit 1; }
          if ! "${COMPOSE[@]}" config --services | grep -qx "$SERVICE_KEY"; then
            echo "::error::service '$SERVICE_KEY' not found in the stack — inspect the server compose first. Found services:"
            "${COMPOSE[@]}" config --services
            exit 1
          fi

          echo "[cd] pulling image..."
          "${COMPOSE[@]}" pull "$SERVICE_KEY"

          echo "[cd] running prisma migrate deploy (before the container swap)..."
          "${COMPOSE[@]}" run --rm --no-deps -T "$SERVICE_KEY" npx prisma migrate deploy < /dev/null

          echo "[cd] swapping platform container..."
          "${COMPOSE[@]}" up -d --no-build "$SERVICE_KEY"

          echo "[cd] polling $HEALTH_URL ..."
          OK=0
          for i in $(seq 1 30); do
            BODY="$(curl -fsS -m 5 "$HEALTH_URL" 2>/dev/null || true)"
            if printf '%s' "$BODY" | grep -q '"db":{"ok":true}'; then
              OK=1
              break
            fi
            sleep 2
          done
          if [ "$OK" -ne 1 ]; then
            echo "::error::health poll failed ($HEALTH_URL)"
            "${COMPOSE[@]}" logs --tail=80 "$SERVICE_KEY"
            echo "::error::previous .env backup: $BACKUP"
            exit 1
          fi

          echo "[cd] deploy OK — platform healthy (db.ok=true)."
          echo "[cd] previous .env backup: $BACKUP"

          # Post-deploy prune: drop old smart-platform images but keep the one
          # currently running. Every deploy pulls a fresh ~2.7GB image and the
          # old ones accumulate (this filled the disk on 2026-09-07). All images
          # are GHCR tags, so the previous ones are re-pullable — safe to remove.
          # Never fail the deploy over a prune hiccup.
          RUNNING="$(docker inspect -f '{{.Image}}' "$SERVICE_KEY" 2>/dev/null || true)"
          OLD="$(docker images ghcr.io/smarterp-multitenant/smart-platform -q 2>/dev/null | grep -vx "$RUNNING" || true)"
          if [ -n "$OLD" ]; then
            echo "[cd] pruning $(printf '%s\n' "$OLD" | wc -l) old smart-platform image(s)..."
            printf '%s\n' "$OLD" | xargs -r docker rmi >/dev/null 2>&1 || true
            echo "[cd] prune done."
          else
            echo "[cd] no old smart-platform images to prune."
          fi
          REMOTE

  notify:
    needs: [ci, container, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Write run summary
        id: summary
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_RESULT: ${{ needs.ci.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          {
            echo "## CI/CD #${{ github.run_number }} summary"
            echo ""
            echo "- **CI:** ${CI_RESULT}"
            echo "- **Image:** ${CONTAINER_RESULT}"
            echo "- **Deploy:** ${DEPLOY_RESULT}"
            echo ""
            echo "[Open run](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
          FAILED=""
          [ "$CI_RESULT" = "success" ] || FAILED="${FAILED} ci"
          [ "$CONTAINER_RESULT" = "success" ] || FAILED="${FAILED} container"
          # 'skipped' is expected for PRs / release pushes (deploy intentionally not triggered).
          if [ "$DEPLOY_RESULT" != "success" ] && [ "$DEPLOY_RESULT" != "skipped" ]; then
            FAILED="${FAILED} deploy"
          fi
          if [ -n "$FAILED" ]; then
            echo "::warning::Failed jobs:${FAILED}"
          fi
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"

      - name: Detect Slack availability
        id: slack
        env:
          URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Slack notification (optional)
        if: steps.slack.outputs.available == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"smart-platform CI/CD #${{ github.run_number }} — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"
