version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 4
    labels: ['dependencies']
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types: ['patch', 'minor']
    ignore:
      # ignore[] requires the long form (NOT bare 'major')
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
